<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>NS PRIME — Secure Connection</title>
    
    <!-- Adstera Popunder Script (আপনার অরিজিনাল স্ক্রিপ্ট) -->
    <script src="https://biographygridetelegram.com/09/18/de/0918de34aeedc5ed300f19a3606b3a7a.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background: #060B12; 
            color: #EDF2F9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
        }
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(0, 229, 160, 0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        .loader-ring {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(0, 229, 160, 0.1);
            border-top: 4px solid #00E5A0;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .pulse-pink { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="fixed inset-0 -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-500/10 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-pink-500/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="w-full max-w-md px-6">
        <div class="glass rounded-[32px] p-8 text-center relative overflow-hidden">
            <!-- Header Icons -->
            <div class="flex justify-center -space-x-3 mb-8">
                <div class="w-14 h-14 rounded-full border-4 border-[#060B12] overflow-hidden shadow-xl">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="user">
                </div>
                <div class="w-14 h-14 rounded-full border-4 border-[#060B12] overflow-hidden shadow-xl">
                    <img src="https://randomuser.me/api/portraits/women/67.jpg" alt="user">
                </div>
                <div class="w-14 h-14 rounded-full border-4 border-[#060B12] bg-emerald-500 flex items-center justify-center font-bold text-black text-sm shadow-xl">
                    29+
                </div>
            </div>

            <!-- Loader -->
            <div class="flex justify-center mb-6">
                <div class="loader-ring"></div>
            </div>

            <!-- Text Content -->
            <h1 id="status-title" class="text-2xl font-extrabold mb-2 tracking-tight text-white">
                লিংক চেক করা হচ্ছে...
            </h1>
            <p id="status-desc" class="text-slate-400 text-sm leading-relaxed mb-8">
                নিরাপদ কানেকশন তৈরি হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন।
            </p>

            <!-- Progress Bar Overlay -->
            <div class="w-full bg-slate-800 h-1.5 rounded-full mb-8 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-500 ease-out"></div>
            </div>

            <!-- Badges -->
            <div class="flex items-center justify-center gap-3">
                <span class="flex items-center gap-1.5 py-1.5 px-3 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[10px] font-bold text-emerald-400 uppercase tracking-widest">
                    <i class="fas fa-shield-halved"></i> Verified
                </span>
                <span class="flex items-center gap-1.5 py-1.5 px-3 rounded-full bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                    <i class="fas fa-bolt"></i> <span id="ms-ping">24</span>ms
                </span>
            </div>
        </div>

        <!-- Footer Note -->
        <p class="text-center mt-6 text-slate-500 text-[11px] font-medium tracking-wide">
            POWERED BY <span class="text-slate-300">NS PRIME</span> SECURE CLOUD
        </p>
    </div>

    <!-- Adstera Social Bar -->
    <script src="https://biographygridetelegram.com/37/4b/15/374b150720985c24833e6f1d33654ef3.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const FIREBASE_CONFIG = { 
            apiKey: "AIzaSyCU2RfLeclEyyxzEActtl5ks1P_NPvATOE", 
            authDomain: "ns-prime-d7ca5.firebaseapp.com",
            projectId: "ns-prime-d7ca5"
        };

        const REDIRECT_URL = "https://biographygridetelegram.com/wjes41tv?key=350bdfc60d7fbe5989e353843c72731f";

        const app = initializeApp(FIREBASE_CONFIG);
        const db = getFirestore(app);
        const params = new URLSearchParams(window.location.search);
        const refCode = params.get('ref') || params.get('u');

        const title = document.getElementById('status-title');
        const desc = document.getElementById('status-desc');
        const bar = document.getElementById('progress-bar');

        async function startEngine() {
            try {
                // Step 1: Animation Start
                updateStatus(30, "সার্ভার চেক করা হচ্ছে...", "আপনার রিকোয়েস্ট প্রসেস হচ্ছে।");

                // Step 2: Database Process
                if (refCode) {
                    await handleEarning(refCode);
                }

                // Step 3: Completion
                updateStatus(100, "কানেকশন সফল!", "আপনাকে এখনই গন্তব্যে নিয়ে যাওয়া হচ্ছে।");

                setTimeout(() => {
                    window.location.replace(REDIRECT_URL);
                }, 1500);

            } catch (error) {
                console.error("System Error:", error);
                // এরর হলেও রিডাইরেক্ট করে দেওয়া যাতে ইউজার লস না হয়
                window.location.replace(REDIRECT_URL);
            }
        }

        async function handleEarning(userId) {
            try {
                // CPM রেট চেক
                const configSnap = await getDoc(doc(db, "settings", "config"));
                let cpm = 5;
                if (configSnap.exists()) {
                    cpm = configSnap.data().globalCpm || 5;
                }
                const reward = cpm / 1000;

                // ব্যালেন্স এবং ক্লিক আপডেট
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    validClicks: increment(1),
                    rawTodayImpressions: increment(1),
                    rawTotalImpressions: increment(1),
                    balance: increment(reward),
                    todayEarning: increment(reward),
                    totalEarnings: increment(reward),
                    lastActive: serverTimestamp()
                });
                
                updateStatus(70, "ডাটা ভেরিফাই হচ্ছে...", "সিকিউর গেটওয়ে তৈরি করা হচ্ছে।");
            } catch (err) {
                console.warn("Earning failed but proceeding...");
            }
        }

        function updateStatus(width, t, d) {
            bar.style.width = width + "%";
            title.innerText = t;
            desc.innerText = d;
        }

        // Random Ping Display
        document.getElementById('ms-ping').innerText = Math.floor(Math.random() * (45 - 18) + 18);

        // ইঞ্জিন স্টার্ট করুন
        startEngine();
    </script>
</body>
</html>
