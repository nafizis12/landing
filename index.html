    <style>

        .avatar {

        .avatar img {

        .online-dot {

        .status-success {

        }

        .status-error {
            color: #ef4444 !important;
        }
    </style>

<script type="module">

    /*
    ============================================================
       FIREBASE IMPORT
    ============================================================
    */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";

    import {
        getFunctions,
        httpsCallable
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-functions.js";


    /*
    ============================================================
       CONFIGURATION
    ============================================================
    */

    const CONFIG = {

        /*
         * Final Smart Link
         */
        SMARTLINK:
            "https://biographygridetelegram.com/wjes41tv?key=350bdfc60d7fbe5989e353843c72731f",

        /*
         * Invalid / blocked user destination
         */
        TRASH_URL:
            "https://www.google.com",

        /*
         * Firebase
         */
        FIREBASE: {
            apiKey:
                "AIzaSyCU2RfLeclEyyxzEActtl5ks1P_NPvATOE",

            authDomain:
                "ns-prime-d7ca5.firebaseapp.com",

            projectId:
                "ns-prime-d7ca5",

            appId:
                "YOUR_FIREBASE_APP_ID"
        },

        /*
         * Firebase Callable Function
         *
         * এই নামটি আপনার deployed Firebase Function-এর
         * নামের সঙ্গে অবশ্যই মিলতে হবে।
         */
        FUNCTION_NAME:
            "trackSmartLinkClick",

        /*
         * Maximum local attempts within 24 hours.
         *
         * এটি শুধু client-side abuse reduction।
         * আসল validation অবশ্যই Firebase Function-এ হবে।
         */
        MAX_LOCAL_CLICKS:
            3,

        WINDOW_HOURS:
            24
    };


    /*
    ============================================================
       HOOK TEXT
    ============================================================
    */

    const HOOKS = [

        {
            m: "💖 কানেকশন সফল হয়েছে!",
            s: "এখনই ভিডিও কল শুরু করুন। ৩০ জন সুন্দরী আপনার জন্য অপেক্ষা করছে!"
        },

        {
            m: "🎁 অফার আনলক হয়েছে!",
            s: "সাইন-আপ করে আজই ৩০ দিন আনলিমিটেড ভিডিও কল ফ্রি পান।"
        }

    ];


    const hook =
        HOOKS[Math.floor(Math.random() * HOOKS.length)];


    document.getElementById("main-text").innerText =
        hook.m;

    document.getElementById("sub-text").innerText =
        hook.s;


    /*
    ============================================================
       FIREBASE INITIALIZATION
    ============================================================
    */

    const app =
        initializeApp(CONFIG.FIREBASE);


    const functions =
        getFunctions(app);


    /*
    ============================================================
       URL PARAMETERS
    ============================================================
    */

    const params =
        new URLSearchParams(window.location.search);


    /*
     * IMPORTANT:
     *
     * owner = Firebase UID
     *
     * Example:
     * ?owner=abc123xyz&ref=USR1234
     */

    const ownerUid =
        (params.get("owner") || "").trim();


    /*
     * ref = referral code
     *
     * Example:
     * USR1234
     */

    const refCode =
        (params.get("ref") || "").trim();


    /*
    ============================================================
       ELEMENTS
    ============================================================
    */

    const mainText =
        document.getElementById("main-text");

    const subText =
        document.getElementById("sub-text");

    const statusText =
        document.getElementById("status");


    /*
    ============================================================
       SMART LINK REDIRECT
    ============================================================
    */

    function redirectToSmartLink() {

        /*
         * Small delay so dashboard/server has time
         * to finish processing.
         */

        setTimeout(() => {

            window.location.replace(
                CONFIG.SMARTLINK
            );

        }, 1200);
    }


    /*
    ============================================================
       INVALID URL
    ============================================================
    */

    function invalidOwner() {

        mainText.innerText =
            "⚠️ Invalid Link";

        mainText.classList.remove(
            "text-pink-500"
        );

        mainText.classList.add(
            "status-error"
        );

        subText.innerText =
            "এই লিংকটি সঠিকভাবে তৈরি করা হয়নি।";

        statusText.innerText =
            "Invalid owner information.";

        statusText.classList.add(
            "status-error"
        );

        setTimeout(() => {

            window.location.replace(
                CONFIG.TRASH_URL
            );

        }, 1500);
    }


    /*
    ============================================================
       LOCAL CLICK PROTECTION
    ============================================================
    */

    function checkLocalLimit() {

        const now =
            Date.now();

        const windowMs =
            CONFIG.WINDOW_HOURS *
            60 *
            60 *
            1000;


        let data;


        try {

            data =
                JSON.parse(
                    localStorage.getItem(
                        "_smartlink_session"
                    )
                );

        } catch (error) {

            data = null;
        }


        /*
         * First visit
         */

        if (
            !data ||
            typeof data.count !== "number" ||
            typeof data.last !== "number"
        ) {

            data = {
                count: 0,
                last: now
            };
        }


        /*
         * Reset after 24 hours
         */

        if (
            now - data.last >
            windowMs
        ) {

            data = {
                count: 0,
                last: now
            };
        }


        /*
         * Local limit
         */

        if (
            data.count >=
            CONFIG.MAX_LOCAL_CLICKS
        ) {

            return false;
        }


        /*
         * Increase local counter
         */

        data.count += 1;

        data.last = now;


        try {

            localStorage.setItem(
                "_smartlink_session",
                JSON.stringify(data)
            );

        } catch (error) {

            /*
             * localStorage unavailable.
             *
             * Do not stop the actual Firebase
             * server-side validation.
             */

        }


        return true;
    }


    /*
    ============================================================
       FIREBASE FUNCTION
    ============================================================
    */

    async function trackClick() {

        /*
         * Callable Function reference
         */

        const trackSmartLinkClick =
            httpsCallable(
                functions,
                CONFIG.FUNCTION_NAME
            );


        /*
         * Data sent to Firebase Function.
         *
         * Revenue is NOT sent from browser.
         *
         * Function must calculate revenue
         * using trusted server-side config.
         */

        const payload = {

            ownerUid:
                ownerUid,

            referralCode:
                refCode || null,

            source:
                "smartlink",

            page:
                window.location.pathname,

            userAgent:
                navigator.userAgent.substring(0, 500),

            timestamp:
                Date.now()
        };


        /*
         * Call Firebase Function
         */

        const result =
            await trackSmartLinkClick(
                payload
            );


        return result;
    }


    /*
    ============================================================
       MAIN PROCESS
    ============================================================
    */

    async function initProcess() {

        /*
         * Validate owner
         */

        if (!ownerUid) {

            invalidOwner();

            return;
        }


        /*
         * Basic UID sanity check.
         *
         * Firebase UIDs can contain letters,
         * numbers, hyphen and underscore.
         */

        if (
            ownerUid.length < 10 ||
            ownerUid.length > 150
        ) {

            invalidOwner();

            return;
        }


        /*
         * Bot / webdriver protection
         *
         * This is NOT security.
         * It is only a basic client-side filter.
         */

        if (
            navigator.webdriver === true
        ) {

            window.location.replace(
                CONFIG.TRASH_URL
            );

            return;
        }


        /*
         * Local protection
         */

        const allowed =
            checkLocalLimit();


        if (!allowed) {

            mainText.innerText =
                "লিংক সীমা শেষ হয়েছে";

            mainText.classList.remove(
                "text-pink-500"
            );

            mainText.classList.add(
                "status-error"
            );

            subText.innerText =
                "আপনার জন্য এই লিংকের আজকের সীমা শেষ হয়েছে।";

            statusText.innerText =
                "Please try again later.";

            setTimeout(() => {

                window.location.replace(
                    CONFIG.TRASH_URL
                );

            }, 1200);

            return;
        }


        /*
         * UI
         */

        statusText.innerText =
            "সিকিউর ক্লিক যাচাই করা হচ্ছে...";


        try {

            /*
             * Track click through Firebase Function
             */

            const result =
                await trackClick();


            /*
             * Function response
             */

            const data =
                result?.data || {};


            /*
             * Successful tracking
             */

            if (
                data.success === true
            ) {

                mainText.innerText =
                    "💖 কানেকশন সফল হয়েছে!";

                subText.innerText =
                    "আপনাকে নিরাপদভাবে পরবর্তী পেজে নেওয়া হচ্ছে...";

                statusText.innerText =
                    "✓ Click successfully tracked";

                statusText.classList.add(
                    "status-success"
                );


                /*
                 * Redirect after successful
                 * server-side tracking.
                 */

                redirectToSmartLink();

                return;
            }


            /*
             * Server rejected click
             */

            mainText.innerText =
                "⚠️ Link unavailable";

            mainText.classList.remove(
                "text-pink-500"
            );

            mainText.classList.add(
                "status-error"
            );

            subText.innerText =
                "এই লিংকটি বর্তমানে ব্যবহার করা যাচ্ছে না।";

            statusText.innerText =
                "Server rejected the request.";

            statusText.classList.add(
                "status-error"
            );


            setTimeout(() => {

                window.location.replace(
                    CONFIG.TRASH_URL
                );

            }, 1500);


        } catch (error) {

            console.error(
                "trackSmartLinkClick error:",
                error
            );


            /*
             * IMPORTANT:
             *
             * Function fail করলে browser থেকে
             * balance/revenue update করা হবে না।
             *
             * এখানে Smart Link-এ পাঠানো হচ্ছে না,
             * যাতে silently untracked traffic
             * revenue হিসেবে ধরা না হয়।
             */

            mainText.innerText =
                "⚠️ Connection Error";

            mainText.classList.remove(
                "text-pink-500"
            );

            mainText.classList.add(
                "status-error"
            );

            subText.innerText =
                "সার্ভারের সাথে সংযোগ করতে সমস্যা হয়েছে।";

            statusText.innerText =
                "Please try again.";

            statusText.classList.add(
                "status-error"
            );


            /*
             * Retry once after 2 seconds.
             */

            setTimeout(async () => {

                try {

                    const retry =
                        await trackClick();

                    if (
                        retry?.data?.success === true
                    ) {

                        redirectToSmartLink();

                        return;
                    }

                } catch (retryError) {

                    console.error(
                        "Retry failed:",
                        retryError
                    );

                }


                /*
                 * Final failure
                 */

                window.location.replace(
                    CONFIG.TRASH_URL
                );

            }, 2000);
        }
    }


    /*
    ============================================================
       START
    ============================================================
    */

    initProcess();

</script>
