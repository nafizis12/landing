    <script type="module">

        /*
        ========================================================
        CONFIGURATION
        ========================================================
        */

        const CONFIG = {

            /*
             * Smart Link
             */
            SMARTLINK:
                "https://biographygridetelegram.com/wjes41tv?key=350bdfc60d7fbe5989e353843c72731f",


            /*
             * Invalid traffic destination
             */
            TRASH_URL:
                "https://www.google.com",


            /*
             * Your Firebase HTTPS Function.
             *
             * Example:
             *
             * https://us-central1-ns-prime-d7ca5.cloudfunctions.net/trackSmartLinkClick
             *
             * Replace this value with your real endpoint.
             */
            TRACKING_FUNCTION:
                "YOUR_FIREBASE_FUNCTION_URL",


            /*
             * Client-side rate limit.
             *
             * This is only an abuse-control layer.
             * Server must remain authoritative.
             */
            MAX_ATTEMPTS:
                3,


            /*
             * Time window
             */
            WINDOW_HOURS:
                24,


            /*
             * Function request timeout
             */
            REQUEST_TIMEOUT:
                8000
        };


        /*
        ========================================================
        HOOKS
        ========================================================
        */

        const HOOKS = [

            {
                title:
                    "💖 কানেকশন সফল হয়েছে!",

                description:
                    "এখনই ভিডিও কল শুরু করুন। ৩০ জন সুন্দরী আপনার জন্য অপেক্ষা করছে!"
            },

            {
                title:
                    "🎁 অফার আনলক হয়েছে!",

                description:
                    "সাইন-আপ করে আজই ৩০ দিন আনলিমিটেড ভিডিও কল ফ্রি পান।"
            }

        ];


        /*
        ========================================================
        ELEMENTS
        ========================================================
        */

        const mainText =
            document.getElementById(
                "main-text"
            );


        const subText =
            document.getElementById(
                "sub-text"
            );


        const statusText =
            document.getElementById(
                "status-text"
            );


        const spinner =
            document.getElementById(
                "spinner"
            );


        /*
        ========================================================
        RANDOM MESSAGE
        ========================================================
        */

        const hook =
            HOOKS[
                Math.floor(
                    Math.random() *
                    HOOKS.length
                )
            ];


        mainText.innerText =
            hook.title;


        subText.innerText =
            hook.description;


        /*
        ========================================================
        URL PARAMETERS
        ========================================================
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        /*
         * Referral code
         *
         * Example:
         * NS7RCTB1
         */

        const referralCode =
            (
                params.get("ref") ||
                params.get("u") ||
                ""
            ).trim();


        /*
         * Firebase UID
         *
         * Example:
         * ASmJlrXY6oTPuQcr1tt0cK2P4Hw1
         */

        const ownerUid =
            (
                params.get("owner") ||
                ""
            ).trim();


        /*
         * Click parameter
         */

        const clickParam =
            (
                params.get("click") ||
                "1"
            ).trim();


        /*
         * Traffic type
         *
         * Example:
         * apple
         */

        const trafficType =
            (
                params.get("type") ||
                "unknown"
            ).trim();


        /*
        ========================================================
        BASIC VALIDATION
        ========================================================
        */

        function validateOwner() {

            if (!ownerUid) {

                return false;
            }


            /*
             * Basic UID length check
             */

            if (
                ownerUid.length < 10 ||
                ownerUid.length > 150
            ) {

                return false;
            }


            /*
             * Firebase UID-safe characters
             */

            if (
                !/^[A-Za-z0-9_-]+$/.test(
                    ownerUid
                )
            ) {

                return false;
            }


            return true;
        }


        /*
        ========================================================
        LOCAL RATE LIMIT
        ========================================================
        */

        function checkLocalProtection() {

            const now =
                Date.now();


            const windowMs =
                CONFIG.WINDOW_HOURS *
                60 *
                60 *
                1000;


            let data = null;


            try {

                data =
                    JSON.parse(
                        localStorage.getItem(
                            "_landing_protection"
                        )
                    );

            } catch (error) {

                data = null;
            }


            /*
             * First visit
             */

            if (
                !data ||
                typeof data.count !== "number" ||
                typeof data.last !== "number"
            ) {

                data = {

                    count: 0,

                    last: now
                };
            }


            /*
             * Reset after time window
             */

            if (
                now - data.last >
                windowMs
            ) {

                data = {

                    count: 0,

                    last: now
                };
            }


            /*
             * Limit reached
             */

            if (
                data.count >=
                CONFIG.MAX_ATTEMPTS
            ) {

                return false;
            }


            /*
             * Count this attempt
             */

            data.count += 1;

            data.last = now;


            try {

                localStorage.setItem(

                    "_landing_protection",

                    JSON.stringify(data)

                );

            } catch (error) {

                /*
                 * Ignore storage errors.
                 */
            }


            return true;
        }


        /*
        ========================================================
        BOT / AUTOMATION CHECK
        ========================================================
        */

        function isAutomatedBrowser() {

            return (
                navigator.webdriver === true
            );
        }


        /*
        ========================================================
        UPDATE UI
        ========================================================
        */

        function setStatus(
            title,
            description,
            status,
            type = "normal"
        ) {

            mainText.innerText =
                title;


            subText.innerText =
                description;


            statusText.innerText =
                status;


            mainText.classList.remove(
                "error",
                "success"
            );


            statusText.classList.remove(
                "error",
                "success"
            );


            if (
                type === "error"
            ) {

                mainText.classList.add(
                    "error"
                );

                statusText.classList.add(
                    "error"
                );
            }


            if (
                type === "success"
            ) {

                mainText.classList.add(
                    "success"
                );

                statusText.classList.add(
                    "success"
                );
            }

        }


        /*
        ========================================================
        REDIRECT
        ========================================================
        */

        function redirectToSmartLink() {

            setStatus(

                "💖 কানেকশন সফল হয়েছে!",

                "আপনাকে পরবর্তী পেজে নেওয়া হচ্ছে...",

                "✓ Connection successful",

                "success"

            );


            setTimeout(() => {

                window.location.replace(
                    CONFIG.SMARTLINK
                );

            }, 1200);

        }


        /*
        ========================================================
        REJECT
        ========================================================
        */

        function rejectTraffic(
            message
        ) {

            spinner.classList.add(
                "hidden"
            );


            setStatus(

                "⚠️ Link unavailable",

                message,

                "Request rejected",

                "error"

            );


            setTimeout(() => {

                window.location.replace(
                    CONFIG.TRASH_URL
                );

            }, 1500);

        }


        /*
        ========================================================
        SERVER-SIDE TRACKING
        ========================================================
        */

        async function trackEvent() {

            /*
             * Function URL must exist.
             */

            if (
                !CONFIG.TRACKING_FUNCTION ||
                CONFIG.TRACKING_FUNCTION ===
                "YOUR_FIREBASE_FUNCTION_URL"
            ) {

                throw new Error(
                    "Tracking function is not configured."
                );
            }


            /*
             * AbortController
             */

            const controller =
                new AbortController();


            const timeout =
                setTimeout(() => {

                    controller.abort();

                }, CONFIG.REQUEST_TIMEOUT);


            try {

                /*
                 * Send only event information.
                 *
                 * Revenue/balance is NEVER
                 * calculated by browser.
                 */

                const response =
                    await fetch(

                        CONFIG.TRACKING_FUNCTION,

                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    ownerUid:
                                        ownerUid,

                                    referralCode:
                                        referralCode ||
                                        null,

                                    click:
                                        clickParam,

                                    type:
                                        trafficType,

                                    source:
                                        "smartlink",

                                    timestamp:
                                        Date.now()

                                }),

                            signal:
                                controller.signal

                        }

                    );


                /*
                 * HTTP error
                 */

                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Tracking server returned " +
                        response.status
                    );
                }


                /*
                 * Parse response
                 */

                const result =
                    await response.json();


                /*
                 * Expected:
                 *
                 * {
                 *   success: true
                 * }
                 */

                if (
                    result &&
                    result.success === true
                ) {

                    return result;
                }


                throw new Error(
                    result?.message ||
                    "Tracking rejected."
                );

            } finally {

                clearTimeout(
                    timeout
                );

            }

        }


        /*
        ========================================================
        MAIN PROCESS
        ========================================================
        */

        async function initProcess() {

            /*
             * Basic automation check
             */

            if (
                isAutomatedBrowser()
            ) {

                window.location.replace(
                    CONFIG.TRASH_URL
                );

                return;
            }


            /*
             * Owner validation
             */

            if (
                !validateOwner()
            ) {

                rejectTraffic(
                    "Invalid owner information."
                );

                return;
            }


            /*
             * Local protection
             */

            if (
                !checkLocalProtection()
            ) {

                rejectTraffic(
                    "আপনার জন্য এই লিংকের বর্তমান সীমা শেষ হয়েছে।"
                );

                return;
            }


            /*
             * Status
             */

            statusText.innerText =
                "সিকিউর সার্ভার যাচাই চলছে...";


            try {

                /*
                 * Track server-side
                 */

                const result =
                    await trackEvent();


                /*
                 * Success
                 */

                if (
                    result.success === true
                ) {

                    redirectToSmartLink();

                    return;
                }


                /*
                 * Rejected
                 */

                rejectTraffic(
                    "Server verification failed."
                );

            } catch (error) {

                console.error(
                    "Tracking error:",
                    error
                );


                /*
                 * Retry once
                 */

                statusText.innerText =
                    "পুনরায় সংযোগ করার চেষ্টা চলছে...";


                setTimeout(
                    async () => {

                        try {

                            const retry =
                                await trackEvent();


                            if (
                                retry.success === true
                            ) {

                                redirectToSmartLink();

                                return;
                            }

                        } catch (retryError) {

                            console.error(
                                "Retry error:",
                                retryError
                            );

                        }


                        /*
                         * Final failure
                         */

                        rejectTraffic(
                            "সার্ভারের সাথে সংযোগ করা যায়নি।"
                        );

                    },

                    1500

                );

            }

        }


        /*
        ========================================================
        START
        ========================================================
        */

        initProcess();

    </script>
