<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Secure Gateway — NS PRIME</title>
    
    <!-- Adstera Popunder -->
    <script src="https://biographygridetelegram.com/09/18/de/0918de34aeedc5ed300f19a3606b3a7a.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background: #060B12; 
            color: #EDF2F9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .prime-card {
            background: rgba(11, 18, 32, 0.8);
            border: 1px solid rgba(0, 229, 160, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .spin-loader {
            border: 3px solid rgba(0, 229, 160, 0.1);
            border-top: 3px solid #00E5A0;
            border-radius: 50%;
            width: 60px; height: 60px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00E5A0, #00C882);
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md px-6 relative z-10">
        <div class="prime-card p-10 text-center">
            <!-- Avatars -->
            <div class="flex justify-center -space-x-3 mb-10">
                <img class="w-12 h-12 rounded-full border-2 border-[#060B12]" src="https://randomuser.me/api/portraits/women/12.jpg">
                <img class="w-12 h-12 rounded-full border-2 border-[#060B12]" src="https://randomuser.me/api/portraits/women/45.jpg">
                <div class="w-12 h-12 rounded-full border-2 border-[#060B12] bg-[#00E5A0] text-[#001A0C] flex items-center justify-center font-bold text-xs">30+</div>
            </div>

            <!-- Loader -->
            <div class="flex justify-center mb-8">
                <div class="spin-loader"></div>
            </div>

            <h2 id="msg-main" class="text-xl font-extrabold text-white mb-2">Connecting...</h2>
            <p id="msg-sub" class="text-slate-400 text-sm mb-10">সার্ভারে সিকিউর কানেকশন তৈরি হচ্ছে।</p>

            <!-- Progress -->
            <div class="progress-bar mb-10">
                <div id="fill" class="progress-fill"></div>
            </div>

            <div class="flex items-center justify-center gap-4">
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-400">Verified System</span>
                <div class="w-1.5 h-1.5 rounded-full bg-slate-700"></div>
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">256-Bit SSL</span>
            </div>
        </div>
        
        <p class="text-center mt-6 text-slate-600 text-[10px] font-bold tracking-widest uppercase">
            Platform Secured by NS Prime
        </p>
    </div>

    <!-- Adstera Social Bar -->
    <script src="https://biographygridetelegram.com/37/4b/15/374b150720985c24833e6f1d33654ef3.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = { 
            apiKey: "AIzaSyCU2RfLeclEyyxzEActtl5ks1P_NPvATOE", 
            authDomain: "ns-prime-d7ca5.firebaseapp.com",
            projectId: "ns-prime-d7ca5"
        };

        const SMART_LINK = "https://biographygridetelegram.com/wjes41tv?key=350bdfc60d7fbe5989e353843c72731f";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const userId = params.get('ref') || params.get('u');

        const fill = document.getElementById('fill');
        const msgMain = document.getElementById('msg-main');
        const msgSub = document.getElementById('msg-sub');

        async function process() {
            try {
                // Phase 1: Start
                updateUI(20, "সার্ভার চেক হচ্ছে", "আপনার রিকোয়েস্ট ভেরিফাই করা হচ্ছে...");

                if (userId) {
                    await addBalance(userId);
                } else {
                    console.log("No User ID found in URL.");
                }

                // Phase 2: Finish
                updateUI(100, "ভেরিফিকেশন সফল!", "আপনাকে এখনই গন্তব্যে নিয়ে যাওয়া হচ্ছে...");

                setTimeout(() => {
                    window.location.replace(SMART_LINK);
                }, 1200);

            } catch (err) {
                console.error("General Error:", err);
                window.location.replace(SMART_LINK);
            }
        }

        async function addBalance(uid) {
            try {
                // ১. CPM রেট বের করা
                let cpmValue = 10; // Default যদি ডাটাবেজে না পাওয়া যায়
                try {
                    const snap = await getDoc(doc(db, "settings", "config"));
                    if (snap.exists() && snap.data().globalCpm) {
                        cpmValue = parseFloat(snap.data().globalCpm);
                    }
                } catch (e) { console.warn("Using default CPM"); }

                // ২. রিওয়ার্ড ক্যালকুলেট (নিশ্চিত করা যে এটি একটি বৈধ সংখ্যা)
                let reward = parseFloat((cpmValue / 1000).toFixed(4));
                if (isNaN(reward) || reward <= 0) reward = 0.01;

                // ৩. ডাটাবেজ আপডেট
                const userRef = doc(db, "users", uid);
                
                // আপডেট রিকোয়েস্ট (আগে ট্রাই করবেন ব্যালেন্স এবং ইম্প্রেশন একসাথে)
                await updateDoc(userRef, {
                    balance: increment(reward),
                    todayEarning: increment(reward),
                    totalEarnings: increment(reward),
                    rawTodayImpressions: increment(1),
                    rawTotalImpressions: increment(1),
                    validClicks: increment(1),
                    lastActive: serverTimestamp()
                });

                console.log("Success: Added BDT " + reward);
                updateUI(70, "পেমেন্ট প্রসেস হচ্ছে", "আপনার একাউন্টে ব্যালেন্স যোগ করা হয়েছে।");

            } catch (error) {
                console.error("Balance Update Failed:", error);
                // যদি ব্যালেন্স আপডেট ফেল করে, তবে অন্তত ইম্প্রেশন কাউন্ট করার চেষ্টা করুন
                try {
                    await updateDoc(doc(db, "users", uid), {
                        rawTodayImpressions: increment(1),
                        lastActive: serverTimestamp()
                    });
                } catch(e) {}
            }
        }

        function updateUI(w, t, s) {
            fill.style.width = w + "%";
            msgMain.innerText = t;
            msgSub.innerText = s;
        }

        // Run
        process();
    </script>
</body>
</html>
