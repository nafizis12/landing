<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Connecting to Private Server...</title>
    
    <!-- Adstera Popunder Script -->
    <script src="https://biographygridetelegram.com/09/18/de/0918de34aeedc5ed300f19a3606b3a7a.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .main-card { background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(236, 72, 153, 0.2); backdrop-filter: blur(10px); border-radius: 24px; padding: 40px 20px; box-shadow: 0 0 30px rgba(236, 72, 153, 0.1); }
        .spinner { width: 70px; height: 70px; border: 4px solid #1f1f1f; border-top-color: #ec4899; border-radius: 50%; animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar-group { display: flex; justify-content: center; margin-bottom: 25px; }
        .avatar { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #050505; margin: 0 -10px; background: #222; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .online-dot { width: 12px; height: 12px; background: #22c55e; border: 2px solid #050505; border-radius: 50%; position: absolute; bottom: 2px; right: 2px; }
        .glow-pink { text-shadow: 0 0 20px rgba(236, 72, 153, 0.7); }
    </style>
</head>
<body>

    <div class="max-w-md w-full px-6 text-center">
        <div class="main-card animate__animated animate__fadeIn">
            <div class="avatar-group">
                <div class="avatar"><img src="https://randomuser.me/api/portraits/women/44.jpg" alt="user"><div class="online-dot"></div></div>
                <div class="avatar"><img src="https://randomuser.me/api/portraits/women/67.jpg" alt="user"><div class="online-dot"></div></div>
                <div class="avatar"><img src="https://randomuser.me/api/portraits/women/32.jpg" alt="user"><div class="online-dot"></div></div>
                <div class="avatar" style="background: #ec4899; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">29+</div>
            </div>

            <div class="spinner mx-auto mb-8"></div>
            
            <h1 id="main-text" class="text-2xl font-black text-pink-500 glow-pink mb-4 tracking-tight">সার্ভারে কানেক্ট হচ্ছে...</h1>
            <p id="sub-text" class="text-gray-400 text-sm mb-8 leading-relaxed px-4">অপেক্ষা করুন...</p>

            <div class="flex flex-wrap items-center justify-center gap-3 text-[10px] text-gray-500 uppercase tracking-widest">
                <span class="bg-black/50 px-3 py-1 rounded-full border border-gray-800"><i class="fas fa-shield-alt text-pink-500 mr-1"></i> Secure</span>
                <span class="bg-black/50 px-3 py-1 rounded-full border border-gray-800"><i class="fas fa-video text-pink-500 mr-1"></i> HD</span>
                <span class="bg-black/50 px-3 py-1 rounded-full border border-gray-800"><span id="ping">24</span>ms</span>
            </div>
        </div>
    </div>

    <!-- Adstera Social Bar Script -->
    <script src="https://biographygridetelegram.com/37/4b/15/374b150720985c24833e6f1d33654ef3.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, setDoc, increment, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const CONFIG = {
            SMARTLINK: "https://biographygridetelegram.com/wjes41tv?key=350bdfc60d7fbe5989e353843c72731f",
            FIREBASE: { 
                apiKey: "AIzaSyCU2RfLeclEyyxzEActtl5ks1P_NPvATOE", 
                authDomain: "ns-prime-d7ca5.firebaseapp.com",
                projectId: "ns-prime-d7ca5"
            }
        };

        const HOOKS = [
            { m: "💖 কানেকশন সফল হয়েছে!", s: "এখনই ভিডিও কল শুরু করুন। ৩০ জন সুন্দরী আপনার জন্য অপেক্ষা করছে!" },
            { m: "🎁 অফার আনলক হয়েছে!", s: "সাইন-আপ করে আজই ৩০ দিন আনলিমিটেড ভিডিও কল ফ্রি পান।" }
        ];

        const hook = HOOKS[Math.floor(Math.random() * HOOKS.length)];
        document.getElementById('main-text').innerText = hook.m;
        document.getElementById('sub-text').innerText = hook.s;

        const app = initializeApp(CONFIG.FIREBASE);
        const db = getFirestore(app);
        const params = new URLSearchParams(window.location.search);
        
        // লিংকের ref অথবা u থেকে আইডি নেওয়া
        const refCode = params.get('ref') || params.get('u');

        async function initProcess() {
            try {
                // কোনো সিকিউরিটি লিমিট নেই, সরাসরি ডাটা আপডেট হবে
                if (refCode) {
                    await updateAdminPanel(refCode);
                }

                // আপডেট হওয়ার জন্য ২ সেকেন্ড সময় নিয়ে রিডাইরেক্ট করা
                setTimeout(() => {
                    window.location.replace(CONFIG.SMARTLINK);
                }, 2000);

            } catch (e) {
                window.location.replace(CONFIG.SMARTLINK);
            }
        }

        async function updateAdminPanel(ref) {
            try {
                // CPM আনা হচ্ছে
                const configSnap = await getDoc(doc(db, "settings", "config"));
                const globalCpm = configSnap.exists() ? (configSnap.data().globalCpm || 5) : 5;
                const earning = globalCpm / 1000;

                // আপনার দেওয়া ডাটাবেজ লিস্ট অনুযায়ী হুবহু ফিল্ডগুলো আপডেট করা হচ্ছে
                const userDocRef = doc(db, "users", ref);
                await setDoc(userDocRef, {
                    // ক্লিকের হিসাব
                    todayClicks: increment(1),
                    totalClicks: increment(1),
                    validClicks: increment(1),
                    
                    // ইম্প্রেশন (চোখের আইকন)
                    rawTodayImpressions: increment(1),
                    rawTotalImpressions: increment(1),
                    
                    // ব্যালেন্স বা আনিং
                    balance: increment(earning),
                    todayEarning: increment(earning),
                    totalEarnings: increment(earning),
                    
                    // অ্যাক্টিভিটি আপডেট
                    lastActive: serverTimestamp()
                }, { merge: true });

                console.log("Success: Stats updated for " + ref);
            } catch (err) {
                console.error("Database Update Error:", err);
            }
        }

        // শুরু করুন
        initProcess();
    </script>
</body>
</html>
