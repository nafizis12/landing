<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Secure Gateway — NS PRIME</title>
    
    <!-- Adstera Popunder -->
    <script src="https://biographygridetelegram.com/09/18/de/0918de34aeedc5ed300f19a3606b3a7a.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background: #060B12; 
            color: #EDF2F9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .prime-card {
            background: rgba(11, 18, 32, 0.8);
            border: 1px solid rgba(0, 229, 160, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .spin-loader {
            border: 3px solid rgba(0, 229, 160, 0.1);
            border-top: 3px solid #00E5A0;
            border-radius: 50%;
            width: 60px; height: 60px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00E5A0, #00C882);
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md px-6 relative z-10">
        <div class="prime-card p-10 text-center">
            <div class="flex justify-center -space-x-3 mb-10">
                <img class="w-12 h-12 rounded-full border-2 border-[#060B12]" src="https://randomuser.me/api/portraits/women/12.jpg">
                <img class="w-12 h-12 rounded-full border-2 border-[#060B12]" src="https://randomuser.me/api/portraits/women/45.jpg">
                <div class="w-12 h-12 rounded-full border-2 border-[#060B12] bg-[#00E5A0] text-[#001A0C] flex items-center justify-center font-bold text-xs">30+</div>
            </div>

            <div class="flex justify-center mb-8">
                <div class="spin-loader"></div>
            </div>

            <h2 id="msg-main" class="text-xl font-extrabold text-white mb-2">Connecting...</h2>
            <p id="msg-sub" class="text-slate-400 text-sm mb-10">সার্ভারে সিকিউর কানেকশন তৈরি হচ্ছে।</p>

            <div class="progress-bar mb-10">
                <div id="fill" class="progress-fill"></div>
            </div>

            <div class="flex items-center justify-center gap-4">
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-400">Secure Gateway</span>
                <div class="w-1.5 h-1.5 rounded-full bg-slate-700"></div>
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">Protection Active</span>
            </div>
        </div>
        
        <p class="text-center mt-6 text-slate-600 text-[10px] font-bold tracking-widest uppercase">
            Platform Secured by NS Prime
        </p>
    </div>

    <!-- Adstera Social Bar -->
    <script src="https://biographygridetelegram.com/37/4b/15/374b150720985c24833e6f1d33654ef3.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCU2RfLeclEyyxzEActtl5ks1P_NPvATOE", 
            authDomain: "ns-prime-d7ca5.firebaseapp.com",
            projectId: "ns-prime-d7ca5"
        };

        const LIMIT_URL = "https://www.google.com";
        const SMART_LINK = "https://biographygridetelegram.com/wjes41tv?key=350bdfc60d7fbe5989e353843c72731f";
        const CLICK_LIMIT = 2; // ২৪ ঘণ্টায় সর্বোচ্চ ২বার
        const RESET_TIME = 24 * 60 * 60 * 1000; // ২৪ ঘণ্টা মিলি-সেকেন্ডে

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('ref') || params.get('u');

        const fill = document.getElementById('fill');
        const msgMain = document.getElementById('msg-main');
        const msgSub = document.getElementById('msg-sub');

        async function initEngine() {
            try {
                if (navigator.webdriver) { window.location.replace(LIMIT_URL); return; }

                updateUI(20, "সার্ভার চেক হচ্ছে", "নিরাপত্তা নিশ্চিত করা হচ্ছে...");

                // ১. আইপি এবং লিমিট চেক
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const userIP = ipData.ip.replace(/\./g, '_');
                const now = Date.now();

                const ipRef = doc(db, "ip_logs", userIP);
                const ipSnap = await getDoc(ipRef);

                let logData = ipSnap.exists() ? ipSnap.data() : { count: 0, lastClick: now };

                // যদি ২৪ ঘণ্টা পার হয়ে যায় তবে কাউন্ট রিসেট হবে
                if (now - logData.lastClick > RESET_TIME) {
                    logData = { count: 0, lastClick: now };
                }

                // লিমিট ক্রস করলে গুগল এ রিডাইরেক্ট
                if (logData.count >= CLICK_LIMIT) {
                    window.location.replace(LIMIT_URL);
                    return;
                }

                // ২. ব্যালেন্স অ্যাড এবং লগ আপডেট
                if (userId) {
                    const status = await addBalance(userId);
                    if (status) {
                        await setDoc(ipRef, {
                            count: increment(1),
                            lastClick: now,
                            ip: ipData.ip
                        }, { merge: true });
                    }
                }

                updateUI(100, "ভেরিফিকেশন সফল!", "আপনাকে এখনই গন্তব্যে নিয়ে যাওয়া হচ্ছে...");
                setTimeout(() => { window.location.replace(SMART_LINK); }, 1200);

            } catch (err) {
                window.location.replace(SMART_LINK);
            }
        }

        async function addBalance(uid) {
            try {
                const configSnap = await getDoc(doc(db, "settings", "config"));
                let cpm = configSnap.exists() ? (parseFloat(configSnap.data().globalCpm) || 10) : 10;
                let reward = parseFloat((cpm / 1000).toFixed(4));

                await updateDoc(doc(db, "users", uid), {
                    balance: increment(reward),
                    todayEarning: increment(reward),
                    totalEarnings: increment(reward),
                    rawTodayImpressions: increment(1),
                    rawTotalImpressions: increment(1),
                    validClicks: increment(1),
                    lastActive: serverTimestamp()
                });
                return true;
            } catch (e) {
                console.warn("Earning skipped or failed");
                return true; // এরর হলেও প্রসেস চলতে দিবে
            }
        }

        function updateUI(w, t, s) {
            fill.style.width = w + "%";
            msgMain.innerText = t;
            msgSub.innerText = s;
        }

        initEngine();
    </script>
</body>
</html>
